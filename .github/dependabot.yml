version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 5
    ignore:
      # @mediapipe/tasks-vision pinned to 0.10.35 due to internal wasm ?url imports and FilesetResolver.isSimdSupported().
      - dependency-name: "@mediapipe/tasks-vision"
        update-types: ["version-update:semver-major"]
      # typescript-eslint v8 supports TypeScript <6.1.0; hold TS 7+ until typescript-eslint supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      minor-and-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
